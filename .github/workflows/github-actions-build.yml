name: Build
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: 'Publish nuget package?'
        required: true
        default: false
        type: boolean
      psw_wix_version:
        description: 'PanelSwWix4 version'
        required: true
        default: 7.1.0-psw-wix-0443.35
        type: string

env:
  DEFAULT_PSW_WIX_VERSION: '7.1.0-psw-wix-0443.35'

jobs:
  Build:
    runs-on: windows-2022
    permissions:
      id-token: write  # For nuget.org publish
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: 'true'
      - uses: microsoft/setup-msbuild@v3

      - name: Resolve build version
        run: |
          $xmlDoc = New-Object System.Xml.XmlDocument
          $file = [System.IO.Path]::Combine("${{ github.workspace }}", "src", "TidyBuild.custom.props")
          [xml]$xmlDoc = Get-Content $file
          $node = $xmlDoc.SelectSingleNode('//*[local-name(.)="FullVersion"]')
          Add-Content -Path ${{ github.env }} -Value ("FULL_VERSION=" + $node.InnerText + ".${{ github.run_number }}")
          
          if ('${{ github.event.inputs.psw_wix_version }}') {
            Add-Content -Path ${{ github.env }} -Value "PSW_WIX_VERSION=${{ github.event.inputs.psw_wix_version }}"
          } else {
            Add-Content -Path ${{ github.env }} -Value "PSW_WIX_VERSION=${{ env.DEFAULT_PSW_WIX_VERSION }}"
          }

      - name: Prepare for build
        run: |
          choco install windows-adk-all
          dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          nuget restore src/dirs.proj

      - name: Build PanelSwWixExtension
        run: msbuild src/dirs.proj -restore -p:FullVersion=${{ env.FULL_VERSION }} -p:UnitTest=all -m

      - name: Test PanelSwWixExtension
        run: msbuild src/dirs.proj -t:RunTests

      - name: Convert to use PanelSwWix4.Sdk
        run: msbuild src/dirs.proj -t:WixtoolsetToPanelSwWix4 "-p:PanelSwWix4Version=${{ env.PSW_WIX_VERSION }}" -p:NugetPrereleaseVersion=-psw-wix

      - name: Build PanelSwWixExtension with PanelSwWix4.Sdk
        run: |
          Remove-Item ("${{ github.workspace }}" + "\build") -Recurse -Force
          msbuild src/dirs.proj -restore -p:FullVersion=${{ env.FULL_VERSION }} "-p:PanelSwWix4Version=${{ env.PSW_WIX_VERSION }}" -p:NugetPrereleaseVersion=-psw-wix -p:EnableZipContainer=true -p:UnitTest=all -m

      - name: Test PanelSwWixExtension with PanelSwWix4.Sdk
        run: msbuild src/dirs.proj -t:RunTests

      - name: Upload unit test logs
        if: ${{ cancelled() || failure() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-test-logs
          path: Build\x*\**\*.log

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: nuget
          path: nuget-out\*.nupkg
          if-no-files-found: error
    
      # Generate NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: Nir.Bar

      - name: Publish nuget packages to github and nuget.org
        if: ${{ github.event.inputs.publish_nuget == 'true' && github.ref == 'refs/heads/master7' }}
        env:
          GITHUB_TOKEN: ${{ secrets.TAGGER_PAT }}
        run: |
          dotnet nuget push nuget-out\PanelSwWixExtension4.*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source github
          dotnet nuget push nuget-out\PanelSwWixExtension4.*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
          git tag "wix7-v${{ env.FULL_VERSION }}"
          git push --tags
